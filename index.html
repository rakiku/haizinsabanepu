<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ネプリーグ再現・オンライン</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- ロビー -->
        <section id="view-lobby" class="view">
            <h1 class="logo">FIVE LEAGUE</h1>
            <div class="card">
                <input type="text" id="room-id" placeholder="ルームID（例: 1234）">
                <button onclick="joinRoom()">ルームに参加 / 作成</button>
                <hr>
                <button class="secondary" onclick="showView('view-admin')">問題セットを作る</button>
            </div>
        </section>

        <!-- 問題作成 -->
        <section id="view-admin" class="view hidden">
            <h2>問題セット作成</h2>
            <div class="card scrollable">
                <input type="text" id="set-title" placeholder="セット名">
                <input type="password" id="set-pass" placeholder="編集用パスワード">
                <div id="question-list"></div>
                <button onclick="addQuestionForm()">+ 問題を追加</button>
                <button class="success" onclick="saveQuestionSet()">保存して戻る</button>
                <button onclick="showView('view-lobby')">キャンセル</button>
            </div>
        </section>

        <!-- ゲーム画面 -->
        <section id="view-game" class="view hidden">
            <div id="game-info">
                <div id="display-timer">残り -- 秒</div>
                <div id="display-mode">--- LEAGUE</div>
            </div>

            <div id="question-area" class="card">
                <img id="q-image" src="" class="hidden">
                <h2 id="q-text">待機中...</h2>
            </div>

            <div id="answer-container"></div>

            <div id="host-panel" class="hidden">
                <p>【ホスト操作パネル】</p>
                <select id="set-selector"></select>
                <button onclick="startNextQuestion()">このセットで開始 / 次へ</button>
                <div id="judge-controls" class="hidden">
                    <button class="reveal-btn" onclick="revealAnswers()">回答オープン！</button>
                    <div class="flex">
                        <button class="success" onclick="judge(true)">✅ 正解</button>
                        <button class="danger" onclick="judge(false)">❌ 不正解</button>
                    </div>
                </div>
            </div>

            <div id="player-panel">
                <p>担当ポジションを選んでください：</p>
                <div id="pos-buttons" class="flex"></div>
            </div>
        </section>
    </div>

    <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
        "firebase/database": "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"
      }
    }
    </script>
    <script type="module" src="script.js"></script>
</body>
</html>
